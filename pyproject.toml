[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "capitaldynamics"
version = "1.0.0"
description = "Transparent economic time-series analysis of capital acquisition and fixed-asset retirement."
readme = "README.md"
requires-python = ">=3.14"
license = { file = "LICENSE.md" }
authors = [{ name = "Alexander Mikhailov" }]
dependencies = [
    "duckdb>=1.5.5",
    "matplotlib>=3.11.1",
    "pandas>=3.0.5",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6"]

[project.scripts]
capital = "capital_analysis.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]
