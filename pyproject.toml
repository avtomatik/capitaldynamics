[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "capitaldynamics"
version = "0.3.0"
description = "Reproducible capital acquisition and retirement analysis"
readme = "README.md"
requires-python = ">=3.14"
license = { file = "LICENSE.md" }
authors = [{ name = "Alexander Mikhailov" }]
dependencies = [
    "duckdb>=1.5.5",
    "matplotlib>=3.11.1",
    "pandas>=3.0.5",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<10",
    "ruff>=0.8,<1",
]

[project.scripts]
capitaldynamics = "capitaldynamics.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/capitaldynamics"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 79
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
